<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" fill="none" role="img" aria-label="SafariCharge logo">
  <!-- Neck -->
  <rect x="60" y="20" width="28" height="72" rx="10" fill="#0d4f32"/>
  <!-- Head -->
  <ellipse cx="74" cy="16" rx="16" ry="12" fill="#0d4f32"/>
  <!-- Ossicones -->
  <rect x="64" y="4" width="5" height="10" rx="2" fill="#0d4f32"/>
  <rect x="78" y="2" width="5" height="12" rx="2" fill="#0d4f32"/>
  <!-- Eye -->
  <circle cx="80" cy="14" r="3" fill="white"/>
  <circle cx="81" cy="14" r="1.5" fill="#0d4f32"/>
  <!-- Body -->
  <ellipse cx="130" cy="82" rx="58" ry="36" fill="#0d4f32"/>
  <!-- Legs -->
  <rect x="84"  y="108" width="14" height="36" rx="6" fill="#0d4f32"/>
  <rect x="106" y="110" width="14" height="34" rx="6" fill="#0d4f32"/>
  <rect x="138" y="110" width="14" height="34" rx="6" fill="#0d4f32"/>
  <rect x="160" y="108" width="14" height="36" rx="6" fill="#0d4f32"/>
  <!-- Tail -->
  <path d="M 186 90 Q 200 100 196 114" stroke="#0d4f32" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Solar panels on back -->
  <rect x="96"  y="52" width="26" height="16" rx="3" fill="#1a6644" transform="rotate(-8 109 60)"/>
  <rect x="126" y="48" width="26" height="16" rx="3" fill="#1a6644" transform="rotate(-3 139 56)"/>
  <rect x="156" y="50" width="24" height="16" rx="3" fill="#1a6644" transform="rotate(3 168 58)"/>
  <!-- Panel grid lines -->
  <line x1="109" y1="53" x2="109" y2="67" stroke="#0d4f32" stroke-width="1" transform="rotate(-8 109 60)"/>
  <line x1="139" y1="49" x2="139" y2="63" stroke="#0d4f32" stroke-width="1" transform="rotate(-3 139 56)"/>
  <line x1="168" y1="51" x2="168" y2="65" stroke="#0d4f32" stroke-width="1" transform="rotate(3 168 58)"/>
  <!-- Wordmark: SAFARI -->
  <text x="218" y="96" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="58" fill="#0d4f32" letter-spacing="1">SAFARI</text>
  <!-- Lightning bolt -->
  <path d="M 392 38 L 372 90 L 392 90 L 366 138 L 370 138 L 400 88 L 380 88 L 398 38 Z" fill="#e07b00"/>
  <!-- Wordmark: CHARGE -->
  <text x="406" y="96" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="58" fill="#0d4f32" letter-spacing="1">CHARGE</text>
</svg>